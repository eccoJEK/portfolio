<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    :root {
      --bg-dark: #1A1D20;      /* RAL 7021 Dark */
      --bg-card: #25282C;      /* Card Surface */
      --text-main: #D7D7D7;    /* RAL 7035 Light Text */
      --text-muted: #8A8E93;   /* Muted Gray */
      --accent: #F7B500;        /* RAL 1023 Yellow Accent */
      --font-mono: 'Courier New', Courier, monospace;
      --font-sans: system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Header Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #33373B;
      margin-bottom: 40px;
    }
    .logo {
      font-family: var(--font-mono);
      font-weight: bold;
      color: var(--accent);
      text-decoration: none;
      font-size: 1.1rem;
    }
    nav a {
      color: var(--text-main);
      text-decoration: none;
      margin-left: 20px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }
    nav a:hover { color: var(--accent); }

    /* UI Elements & Typography */
    .tag-mono {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid #33373B;
      padding: 20px;
      text-decoration: none;
      color: var(--text-main);
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { margin: 10px 0 5px 0; color: #FFFFFF; font-size: 1.2rem; }

    footer {
      margin-top: 80px;
      padding-top: 20px;
      border-top: 1px solid #33373B;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <a href="{{ "/" | relURL }}" class="logo">// {{ .Site.Title }}</a>
    <nav>
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <div>SYSTEM LOG: ONLINE</div>
    <div>PALETTE: RAL 7021 / 7035 / 1023</div>
  </footer>
</body>
</html>
