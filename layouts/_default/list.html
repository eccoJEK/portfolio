{{ define "main" }}
<section style="margin-bottom: 30px;">
  <span style="color: var(--accent); font-size: 0.85rem;">[INDEX]</span>
  <h1 style="font-family: var(--font-display); font-size: 3rem; color: var(--text-white); font-weight: 800; margin-top: 8px;">Archive</h1>
</section>

<div class="grid">
  {{ range .Pages }}
  <a href="{{ .RelPermalink }}" class="card">
    <div>
      <div class="card-category">// {{ .Params.category }}</div>
      <h3>{{ .Title }}</h3>
      <p>{{ .Summary | truncate 110 }}</p>
    </div>
    <div style="font-size: 0.8rem; color: var(--text-white); font-weight: 700;">
      OPEN ENTRY &rarr;
    </div>
  </a>
  {{ end }}
</div>
{{ end }}
