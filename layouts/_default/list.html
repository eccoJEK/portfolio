{{ define "main" }}
<section style="margin-bottom: 40px;">
  <div class="badge">
    <span>INDEX</span>
  </div>
  <h1 style="font-family: var(--font-display); font-size: 3.5rem; color: var(--text-white); font-weight: 700; letter-spacing: -0.02em;">All Projects</h1>
</section>

<div class="grid">
  {{ range .Pages }}
  <a href="{{ .RelPermalink }}" class="card">
    <div>
      <div class="card-meta">
        <span class="card-category">{{ .Params.category }}</span>
      </div>
      <h3>{{ .Title }}</h3>
      <p>{{ .Summary | truncate 120 }}</p>
    </div>
    <div class="card-footer">
      <span>VIEW DETAILS</span>
      <span>&rarr;</span>
    </div>
  </a>
  {{ end }}
</div>
{{ end }}
