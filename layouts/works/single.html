{{ define "main" }}
<section style="margin-bottom: 30px;">
  <span style="color: var(--accent); font-size: 0.9rem; letter-spacing: 0.05em;">[PORTFOLIO]</span>
  <h1 style="font-family: var(--font-display); font-size: 3.5rem; font-weight: 400; color: var(--text-white); margin-top: 8px;">Projects</h1>
</section>

<div class="grid">
  {{ range .Pages }}
  <a href="{{ .RelPermalink }}" class="card">
    <div>
      <div class="card-category">// {{ .Params.category }}</div>
      <h3>{{ .Title }}</h3>
      <p>{{ .Summary | truncate 110 }}</p>
    </div>
    <div style="font-size: 0.85rem; color: var(--text-white); font-weight: 600;">
      OPEN PROJECT &rarr;
    </div>
  </a>
  {{ end }}
</div>
{{ end }}
